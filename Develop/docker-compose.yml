version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: pa64_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: pa64_redis_commander
    environment:
      - REDIS_HOSTS=local:pa64_redis:6379
      - HTTP_USER=admin
      - HTTP_PASSWORD=pa64_admin_2026
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
